name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  run-python-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (source repo)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip python3-pip
          pip install requests "requests[socks]"

      - name: Create temporary folder
        run: mkdir -p 2pm

      - name: Unzip main file
        env:
          ZIP_FILE: ${{ secrets.ZIP_FILE }}
        run: |
          unzip -o -P "$ZIP_FILE" 2pm.zip -d 2pm

      - name: Run Python script
        run: python3 2pm/2pm.py

      - name: Repack ZIP
        env:
          ZIP_FILE: ${{ secrets.ZIP_FILE }}
        run: |
          rm -f 2pm.zip
          zip -r -P "$ZIP_FILE" 2pm.zip 2pm

      - name: Commit and push updated ZIP to source repository
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add 2pm.zip
          git commit -m "Update protected ZIP [$(date '+%Y-%m-%d %H:%M:%S')]" || echo "No ZIP changes"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push

      - name: Cleanup temporary folder
        if: always()
        run: rm -rf 2pm

      - name: Clone target repository
        run: |
          git clone https://x-access-token:${{ secrets.GET_API_TOKEN }}@${{ secrets.GET_URL }} target-repo

      - name: Copy generated files to target repo
        run: |
          cp -f *.m3u target-repo/ 2>/dev/null || true
          mkdir -p target-repo/script_api
          cp -f script_api/data.json target-repo/script_api/ 2>/dev/null || true

      - name: Commit and push changes
        run: |
          cd target-repo
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Update playlists and api.json [$(date '+%Y-%m-%d %H:%M:%S')]" || echo "No changes to commit"
          git pull --rebase origin HEAD || true
          git push
